<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtechie Compiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            background-color: #df2771;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(247, 247, 247, 0.3);
            letter-spacing: 1px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .editor-container {
            background-color: #2d2d44;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .editor-header {
            background-color: #1a1a2e;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .editor-title {
            font-weight: 600;
            color: white;
        }
        
        .editor {
            height: 200px;
            overflow: auto;
        }
        
        textarea {
            width: 100%;
            height: 100%;
            background-color: #2d2d44;
            color: #f0f0f0;
            border: none;
            padding: 15px;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        
        textarea:focus {
            outline: 2px solid #df2771;
        }
        
        .output-container {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .output-header {
            background-color: #df2771;
            color: white;
            padding: 15px;
            font-weight: 600;
        }
        
        #output {
            height: 645px;
            padding: 20px;
            color: #333;
            overflow: auto;
        }
        
        .button {
            background-color: #df2771;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #c21c60;
        }
        
        .tabs {
            display: flex;
            background-color: #1a1a2e;
            padding: 0 15px;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #c21c60;
            margin-right: 5px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        
        .tab.active {
            background-color: #c21c60;
        }
    </style>
</head>
<body>
    <header>
        <h1>Webtechie Compiler</h1>
    </header>
    
    <div class="container">
        <div class="editor-container">
            <div class="tabs">
                <div class="tab active" data-tab="html">HTML</div>
                <div class="tab" data-tab="css">CSS</div>
                <div class="tab" data-tab="js">JavaScript</div>
            </div>
            
            <div class="editor-header">
                <div class="editor-title">Write Code Here</div>
                <button class="button" id="run-btn">Run Code</button>
            </div>
            
            <div class="editor">
                <textarea id="html-code" placeholder="Write your HTML here..."><!-- Welcome to Webtechie Compiler -->
<div class="output-container">
  <h2>Welcome to Webtechie Compiler</h2>
  <p>This is a simple compiler that allows you to write HTML, CSS, and JavaScript code and see the output in real-time.</p>
  
  <div class="demo-box">
    <h3>Try it out!</h3>
    <p>Edit the code on the left and click "Run Code" to see your changes.</p>
    <button id="demo-button">Click Me!</button>
  </div>
</div>

<style>
  .output-container {
    padding: 20px;
    font-family: Arial, sans-serif;
  }
  
  .demo-box {
    background-color: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    border-left: 4px solid #df2771;
  }
  
  #demo-button {
    background-color: #df2771;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
  }
</style>

<script>
  document.getElementById('demo-button').addEventListener('click', function() {
    alert('Button clicked! Webtechie Compiler is working!');
  });
</script></textarea>
                <textarea id="css-code" placeholder="Write your CSS here..." style="display: none;">/* Add your CSS styles here */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  line-height: 1.6;
  color: #333;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

h2 {
  color: #df2771;
  border-bottom: 2px solid #df2771;
  padding-bottom: 10px;
  margin-bottom: 20px;
}

h3 {
  color: #2d2d44;
  margin-bottom: 10px;
}

p {
  margin-bottom: 15px;
}</textarea>
                <textarea id="js-code" placeholder="Write your JavaScript here..." style="display: none;">// Add your JavaScript here
console.log("Webtechie Compiler is working!");

// You can add more interactive functionality here
document.addEventListener('DOMContentLoaded', function() {
  // This ensures the DOM is fully loaded before executing scripts
});</textarea>
            </div>
        </div>
        
        <div class="output-container">
            <div class="output-header">Output</div>
            <div id="output"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const htmlCode = document.getElementById('html-code');
            const cssCode = document.getElementById('css-code');
            const jsCode = document.getElementById('js-code');
            const runBtn = document.getElementById('run-btn');
            const output = document.getElementById('output');
            const tabs = document.querySelectorAll('.tab');
            
            // Tab switching functionality
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all tabs
                    tabs.forEach(t => t.classList.remove('active'));
                    
                    // Add active class to clicked tab
                    tab.classList.add('active');
                    
                    // Hide all textareas
                    document.querySelectorAll('.editor textarea').forEach(ta => {
                        ta.style.display = 'none';
                    });
                    
                    // Show the selected textarea
                    const tabName = tab.getAttribute('data-tab');
                    document.getElementById(`${tabName}-code`).style.display = 'block';
                });
            });
            
            // Run code function
            function runCode() {
                const html = htmlCode.value;
                const css = `<style>${cssCode.value}</style>`;
                const js = `<script>${jsCode.value}<\/script>`;
                
                output.innerHTML = html + css + js;
            }
            
            // Run code on button click
            runBtn.addEventListener('click', runCode);
            
            // Run code on initial load
            runCode();
        });
    </script>
</body>
</html>
